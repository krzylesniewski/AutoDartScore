<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>AUTO Score: Scena</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--color-bg); color:var(--color-text); font-family:var(--font-body); overflow:hidden; }
  .cover { position:relative; width:960px; height:288px; overflow:hidden; background:radial-gradient(ellipse 700px 420px at 70% -20%, var(--color-bg-glow) 0%, var(--color-bg-mid) 45%, var(--color-bg) 100%); }
  .art { position:absolute; left:0; top:0; width:960px; height:288px; }
  .accent { fill:var(--color-accent); }
  .deep { fill:var(--color-surface-raised); }
  .cream { fill:var(--color-text); }
  .gold { fill:var(--color-gold); }
  .card { rx:var(--radius-card); }
  .panel { rx:var(--radius-panel); }
  .ring { fill:none; stroke:var(--color-text); stroke-width:1.5; opacity:.35; }
  .ring.on-accent { stroke:var(--color-on-accent); opacity:.45; }
  .wire { stroke:var(--color-text); stroke-width:1.5; opacity:.35; }
  .words { position:absolute; left:var(--space-page); bottom:var(--space-page); max-width:440px; }
  .name { margin:0; font-family:var(--font-display); font-weight:900; font-size:64px; line-height:.95; letter-spacing:.01em; color:var(--color-text); }
  .tag { margin:var(--space-3) 0 0 2px; font-size:14px; line-height:20px; color:var(--color-text-muted); }
</style>
</head>
<body>
<div class="cover">
<svg class="art" viewBox="0 0 960 288" width="960" height="288" aria-hidden="true">
<!--
  blocks      color-accent 196×230 bled off the top (the drop of red the brand is known by) · color-surface-raised 268×226 bled off the right (the card) · color-text pill 124×42 (the cream) · color-gold disc 42 (the win, small) — ≈38% of 960×288
  arrangement one red slab and one dark card side by side, a cream pill and a gold disc under the slab; every block right of x = 496
  pattern     literal motif, the dartboard the Stage draws behind every screen: rings at r 110/102/62/56/14 and 20 wires every 18°, cut into the dark card; two rings cut into the red slab in color-on-accent
  scales      gutters space-5 (14) and space-page (28); corners radius-card (18) on the slab, radius-panel (22) on the card, pill and disc rx = half of 42
-->
