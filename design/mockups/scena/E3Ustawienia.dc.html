<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Ustawienia</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800;900&amp;family=Barlow:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1600px; height: 900px; box-sizing: border-box; position: relative; overflow: hidden; background: radial-gradient(ellipse 1000px 700px at 62% -10%, #2b201a 0%, #16120f 45%, #0a0908 100%); color: #f3ecd8; font-family: 'Barlow', sans-serif; display: flex; flex-direction: column;">
  <svg width="1000" height="1000" viewBox="-500 -500 1000 1000" aria-hidden="true" style="position: absolute; left: 900px; top: 300px; opacity: 0.07;">
    <circle r="490" fill="none" stroke="#f3ecd8" stroke-width="1"></circle>
    <circle r="455" fill="none" stroke="#f3ecd8" stroke-width="1"></circle>
    <circle r="430" fill="none" stroke="#f3ecd8" stroke-width="1"></circle>
    <circle r="270" fill="none" stroke="#f3ecd8" stroke-width="1"></circle>
    <circle r="252" fill="none" stroke="#f3ecd8" stroke-width="1"></circle>
    <sc-for list="{{wires}}" as="w" hint-placeholder-count="20"><line x1="0" y1="-275" x2="0" y2="-490" stroke="#f3ecd8" stroke-width="1" transform="{{w}}"></line></sc-for>
  </svg>

  <header style="position: relative; height: 68px; box-sizing: border-box; padding: 0 28px; display: flex; align-items: center; gap: 14px; border-bottom: 1px solid rgba(243,236,216,0.11);">
    <svg width="32" height="32" viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="17" r="15" fill="#d8352a"></circle><circle cx="17" cy="17" r="10" fill="#0a0908"></circle><circle cx="17" cy="17" r="6" fill="#f3ecd8"></circle><circle cx="17" cy="17" r="2.4" fill="#d8352a"></circle></svg>
    <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 24px; letter-spacing: 0.08em; margin-right: 22px;">AUTO SCORE</span>
    <nav aria-label="Główna nawigacja" style="display: flex; gap: 4px; align-self: stretch;">
      <a href="#" style="position: relative; display: flex; align-items: center; padding: 0 16px; color: #a8a08a; text-decoration: none; font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 20px;">Nowa gra</a>
      <a href="#" style="position: relative; display: flex; align-items: center; padding: 0 16px; color: #a8a08a; text-decoration: none; font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 20px;">Statystyki</a>
      <a href="#" style="position: relative; display: flex; align-items: center; padding: 0 16px; color: #a8a08a; text-decoration: none; font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 20px;">Historia</a>
      <a href="#" aria-current="page" style="position: relative; display: flex; align-items: center; padding: 0 16px; color: #f3ecd8; text-decoration: none; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 20px;">Ustawienia<span aria-hidden="true" style="position: absolute; left: 12px; right: 12px; bottom: -1px; height: 3px; border-radius: 3px; background: #d8352a; box-shadow: 0 0 14px 2px rgba(216,53,42,0.5);"></span></a>
    </nav>
    <span style="flex-grow: 1;"></span>
    <span style="display: inline-flex; align-items: center; gap: 8px; color: #a8a08a; background: rgba(243,236,216,0.035); padding: 8px 14px; border-radius: 999px; font-size: 15px;"><span aria-hidden="true" style="width: 10px; height: 10px; border-radius: 50%; box-sizing: border-box; border: 2px solid #a8a08a;"></span>Kamera: brak</span>
    <span style="display: inline-flex; align-items: center; gap: 8px; color: #a8a08a; background: rgba(243,236,216,0.035); padding: 8px 14px; border-radius: 999px; font-size: 15px;"><span aria-hidden="true" style="width: 10px; height: 10px; border-radius: 50%; background: #3ddc84;"></span>Głos: włączony</span>
  </header>

  <main style="position: relative; flex-grow: 1; box-sizing: border-box; padding: 40px 28px 28px; display: flex; flex-direction: column; gap: 34px; min-height: 0;">
    <div style="display: flex; flex-direction: column; gap: 10px;">
      <h1 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 64px; line-height: 0.9; letter-spacing: 0.01em; text-transform: uppercase;">Ustawienia</h1>
      <p style="margin: 0; font-size: 17px; line-height: 1.4; color: #a8a08a;">Zapisane na tym urządzeniu</p>
    </div>

    <div style="display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 28px; align-items: start;">
      <section aria-labelledby="set-keypad" style="display: flex; flex-direction: column; gap: 14px;">
        <h2 id="set-keypad" style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 15px; line-height: 1; letter-spacing: 0.18em; color: #a8a08a;">KLAWIATURA</h2>
        <div role="radiogroup" aria-labelledby="set-keypad" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px;">
          <label style="position: relative; height: 340px; box-sizing: border-box; border-radius: 22px; padding: 22px 24px; background: linear-gradient(180deg, #2a2420 0%, #1b1714 100%); box-shadow: 0 0 0 2px #f3ecd8 inset, 0 30px 60px -24px rgba(0,0,0,0.85); display: flex; flex-direction: column; gap: 16px; cursor: pointer; overflow: hidden;">
            <input type="radio" name="keypad-layout" value="ring" checked style="position: absolute; width: 1px; height: 1px; margin: 0; opacity: 0;">
            <svg width="230" height="230" viewBox="0 0 230 230" aria-hidden="true" style="align-self: center;">
              <sc-for list="{{ringDots}}" as="d" hint-placeholder-count="20"><circle cx="{{d.x}}" cy="{{d.y}}" r="13" fill="#2a2420" stroke="rgba(243,236,216,0.22)" stroke-width="1.5"></circle></sc-for>
              <rect x="70" y="100" width="42" height="30" rx="15" fill="#2a2420" stroke="rgba(243,236,216,0.22)" stroke-width="1.5"></rect>
              <rect x="118" y="100" width="42" height="30" rx="15" fill="#2a2420" stroke="#d8352a" stroke-width="2"></rect>
            </svg>
            <span style="display: flex; align-items: center; gap: 12px; margin-top: auto;">
              <svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true" fill="#c9bfa6"><path d="M12 2.5a2 2 0 110 4 2 2 0 010-4zm0 15a2 2 0 110 4 2 2 0 010-4zM4.5 10a2 2 0 110 4 2 2 0 010-4zm15 0a2 2 0 110 4 2 2 0 010-4zM6.7 4.7a2 2 0 110 4 2 2 0 010-4zm10.6 0a2 2 0 110 4 2 2 0 010-4zM6.7 15.3a2 2 0 110 4 2 2 0 010-4zm10.6 0a2 2 0 110 4 2 2 0 010-4z"></path></svg>
              <span style="flex-grow: 1; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 30px; line-height: 1;">Koło</span>
              <span aria-hidden="true" style="width: 36px; height: 36px; border-radius: 50%; background: #f3ecd8; display: flex; align-items: center; justify-content: center;"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" fill="#0a0908"><path d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"></path></svg></span>
            </span>
          </label>
          <label style="position: relative; height: 340px; box-sizing: border-box; border-radius: 22px; padding: 22px 24px; background: rgba(243,236,216,0.035); box-shadow: 0 0 0 1px rgba(243,236,216,0.11) inset; display: flex; flex-direction: column; gap: 16px; cursor: pointer; overflow: hidden;">
            <input type="radio" name="keypad-layout" value="grid" style="position: absolute; width: 1px; height: 1px; margin: 0; opacity: 0;">
            <svg width="300" height="230" viewBox="0 0 300 230" aria-hidden="true" style="align-self: center;">
              <sc-for list="{{gridCells}}" as="g" hint-placeholder-count="20"><rect x="{{g.x}}" y="{{g.y}}" width="24" height="30" rx="6" fill="#2a2420" stroke="rgba(243,236,216,0.22)" stroke-width="1.5"></rect></sc-for>
              <rect x="10" y="148" width="54" height="30" rx="6" fill="#2a2420" stroke="rgba(243,236,216,0.22)" stroke-width="1.5"></rect>
              <rect x="70" y="148" width="54" height="30" rx="6" fill="#2a2420" stroke="#d8352a" stroke-width="2"></rect>
              <rect x="130" y="148" width="160" height="30" rx="6" fill="#2a2420" stroke="rgba(243,236,216,0.22)" stroke-width="1.5"></rect>
            </svg>
            <span style="display: flex; align-items: center; gap: 12px; margin-top: auto;">
              <svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true" fill="#c9bfa6"><path d="M3 3h5v5H3zm6.5 0h5v5h-5zM16 3h5v5h-5zM3 9.5h5v5H3zm6.5 0h5v5h-5zm6.5 0h5v5h-5zM3 16h5v5H3zm6.5 0h5v5h-5zm6.5 0h5v5h-5z"></path></svg>
              <span style="flex-grow: 1; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 30px; line-height: 1;">Siatka</span>
            </span>
          </label>
        </div>
      </section>

      <section aria-labelledby="set-sound" style="display: flex; flex-direction: column; gap: 14px;">
        <h2 id="set-sound" style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 15px; line-height: 1; letter-spacing: 0.18em; color: #a8a08a;">DŹWIĘK</h2>
        <div style="display: flex; flex-direction: column; gap: 14px;">
          <button type="button" aria-pressed="true" style="height: 104px; box-sizing: border-box; border: 0; border-radius: 18px; padding: 0 24px; background: linear-gradient(180deg, #2a2420 0%, #1b1714 100%); box-shadow: 0 1px 0 rgba(243,236,216,0.11) inset, 0 24px 48px -16px rgba(0,0,0,0.8), 0 0 0 1px rgba(243,236,216,0.11); color: #f3ecd8; display: flex; align-items: center; gap: 18px; text-align: left; cursor: pointer;">
            <span style="width: 52px; height: 52px; border-radius: 50%; background: rgba(243,236,216,0.07); display: flex; align-items: center; justify-content: center; flex-shrink: 0;"><svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true" fill="#f3ecd8"><path d="M3 9h4l5-5v16l-5-5H3zm11-1v8a4.5 4.5 0 000-8zm0-4.8v2.1a7 7 0 010 13.4v2.1a9 9 0 000-17.6z"></path></svg></span>
            <span style="flex-grow: 1; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 30px; line-height: 1;">Głos</span>
            <span aria-hidden="true" style="display: inline-flex; align-items: center; gap: 6px; height: 38px; padding: 0 14px 0 10px; border-radius: 999px; background: #f3ecd8; color: #0a0908; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 19px;"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" fill="#0a0908"><path d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"></path></svg>włączony</span>
          </button>
          <button type="button" aria-pressed="true" style="height: 104px; box-sizing: border-box; border: 0; border-radius: 18px; padding: 0 24px; background: linear-gradient(180deg, #2a2420 0%, #1b1714 100%); box-shadow: 0 1px 0 rgba(243,236,216,0.11) inset, 0 24px 48px -16px rgba(0,0,0,0.8), 0 0 0 1px rgba(243,236,216,0.11); color: #f3ecd8; display: flex; align-items: center; gap: 18px; text-align: left; cursor: pointer;">
            <span style="width: 52px; height: 52px; border-radius: 50%; background: rgba(243,236,216,0.07); display: flex; align-items: center; justify-content: center; flex-shrink: 0;"><svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true" fill="#f3ecd8"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"></path></svg></span>
            <span style="flex-grow: 1; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 30px; line-height: 1;">Efekty dźwiękowe</span>
            <span aria-hidden="true" style="display: inline-flex; align-items: center; gap: 6px; height: 38px; padding: 0 14px 0 10px; border-radius: 999px; background: #f3ecd8; color: #0a0908; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 19px;"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" fill="#0a0908"><path d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"></path></svg>włączone</span>
          </button>
          <button type="button" aria-pressed="false" style="height: 104px; box-sizing: border-box; border: 0; border-radius: 18px; padding: 0 24px; background: rgba(243,236,216,0.035); box-shadow: 0 0 0 1px rgba(243,236,216,0.11) inset; color: #f3ecd8; display: flex; align-items: center; gap: 18px; text-align: left; cursor: pointer;">
            <span style="width: 52px; height: 52px; border-radius: 50%; background: rgba(243,236,216,0.07); display: flex; align-items: center; justify-content: center; flex-shrink: 0;"><svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true" fill="#c9bfa6"><path d="M3.27 2L2 3.27l1.73 1.73A2 2 0 004 5v17l4-4h7.73l5 5L22 21.73zM20 3H7.83l13.92 13.92A2 2 0 0022 16V5a2 2 0 00-2-2z"></path></svg></span>
            <span style="flex-grow: 1; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 30px; line-height: 1;">Komentarze do zera</span>
            <span aria-hidden="true" style="display: inline-flex; align-items: center; height: 38px; padding: 0 14px; border-radius: 999px; box-shadow: 0 0 0 1px rgba(243,236,216,0.12) inset; color: #c9bfa6; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 19px;">wyłączone</span>
          </button>
        </div>
      </section>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1600,"height":900}}'>
class Component extends DCLogic {
renderVals() {
const wires = Array.from({ length: 20 }, (x, i) => 'rotate(' + (i * 18 + 9) + ')');
const ringDots = Array.from({ length: 20 }, (x, i) => {
const a = (i * 18) * Math.PI / 180;
return { x: Math.round(115 + 96 * Math.sin(a)), y: Math.round(115 - 96 * Math.cos(a)) };
});
const gridCells = Array.from({ length: 20 }, (x, i) => ({ x: 10 + (i % 10) * 28.4, y: 52 + Math.floor(i / 10) * 44 }));
return { wires, ringDots, gridCells };
}
}
</script>
</body>
</html>
