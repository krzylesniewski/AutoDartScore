<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Trening Końcówki</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800;900&amp;family=Barlow:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1600px; height: 900px; box-sizing: border-box; position: relative; overflow: hidden; background: radial-gradient(ellipse 1000px 700px at 62% -10%, #2b201a 0%, #16120f 45%, #0a0908 100%); color: #f3ecd8; font-family: 'Barlow', sans-serif; display: flex; flex-direction: column;">
  <svg width="1000" height="1000" viewBox="-500 -500 1000 1000" aria-hidden="true" style="position: absolute; left: 640px; top: 200px; opacity: 0.07;">
    <circle r="490" fill="none" stroke="#f3ecd8" stroke-width="1"></circle>
    <circle r="455" fill="none" stroke="#f3ecd8" stroke-width="1"></circle>
    <circle r="430" fill="none" stroke="#f3ecd8" stroke-width="1"></circle>
    <circle r="270" fill="none" stroke="#f3ecd8" stroke-width="1"></circle>
    <circle r="252" fill="none" stroke="#f3ecd8" stroke-width="1"></circle>
    <sc-for list="{{wires}}" as="w" hint-placeholder-count="20"><line x1="0" y1="-275" x2="0" y2="-490" stroke="#f3ecd8" stroke-width="1" transform="{{w}}"></line></sc-for>
  </svg>

  <header style="position: relative; height: 68px; box-sizing: border-box; padding: 0 28px; display: flex; align-items: center; gap: 14px;">
    <a href="#" aria-label="Ekran startowy" style="display: flex; align-items: center; gap: 14px; color: #f3ecd8; text-decoration: none;">
      <svg width="32" height="32" viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="17" r="15" fill="#d8352a"></circle><circle cx="17" cy="17" r="10" fill="#0a0908"></circle><circle cx="17" cy="17" r="6" fill="#f3ecd8"></circle><circle cx="17" cy="17" r="2.4" fill="#d8352a"></circle></svg>
      <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 24px; letter-spacing: 0.08em;">AUTO SCORE</span>
    </a>
    <span style="width: 1px; height: 24px; background: rgba(243,236,216,0.11); margin: 0 8px;"></span>
    <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 19px; color: #c9bfa6;">Trening · Końcówki · 51-100</span>
    <span style="flex-grow: 1;"></span>
    <button type="button" style="height: 44px; padding: 0 16px; border: 0; border-radius: 12px; background: transparent; box-shadow: 0 0 0 1px rgba(243,236,216,0.12) inset; color: #f3ecd8; font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 19px; display: flex; align-items: center; gap: 8px;"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" fill="#f3ecd8"><path d="M6 6h12v12H6z"></path></svg>Zakończ trening</button>
    <button type="button" aria-label="Głos: włączony" aria-pressed="true" style="width: 44px; height: 44px; background: rgba(243,236,216,0.07); border: 0; border-radius: 999px; display: flex; align-items: center; justify-content: center;"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" fill="#f3ecd8"><path d="M3 9h4l5-5v16l-5-5H3zm11-1v8a4.5 4.5 0 000-8zm0-4.8v2.1a7 7 0 010 13.4v2.1a9 9 0 000-17.6z"></path></svg></button>
    <button type="button" aria-label="Efekty dźwiękowe: włączone" aria-pressed="true" style="width: 44px; height: 44px; background: rgba(243,236,216,0.07); border: 0; border-radius: 999px; display: flex; align-items: center; justify-content: center;"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" fill="#f3ecd8"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"></path></svg></button>
  </header>

  <main style="position: relative; flex-grow: 1; box-sizing: border-box; padding: 8px 28px 28px; display: flex; gap: 28px; min-height: 0;">
    <section aria-label="Wyniki" style="width: 450px; display: flex; flex-direction: column; gap: 14px;">
      <div style="height: 240px; box-sizing: border-box; border-radius: 18px; padding: 24px 28px; background: linear-gradient(180deg, #2a2420 0%, #1b1714 100%); box-shadow: 0 1px 0 rgba(243,236,216,0.11) inset, 0 24px 48px -16px rgba(0,0,0,0.8), 0 0 0 1px rgba(243,236,216,0.11); display: flex; flex-direction: column; justify-content: space-between; position: relative; overflow: hidden;">
        <svg width="260" height="260" viewBox="0 0 200 200" aria-hidden="true" style="position: absolute; right: -70px; top: -70px; opacity: 0.07;"><circle cx="100" cy="100" r="95" fill="none" stroke="#f3ecd8" stroke-width="8"></circle><circle cx="100" cy="100" r="58" fill="none" stroke="#f3ecd8" stroke-width="8"></circle><circle cx="100" cy="100" r="22" fill="#f3ecd8"></circle></svg>
        <div style="display: flex; align-items: center; gap: 14px; position: relative;">
          <span style="width: 58px; height: 58px; border-radius: 50%; background: #ff70b8; color: #111111; display: flex; align-items: center; justify-content: center; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 26px; box-shadow: 0 0 0 3px #1b1714, 0 0 0 5px #ff70b8, 0 0 24px 2px rgba(255,112,184,0.45);">XD</span>
          <div style="display: flex; flex-direction: column;">
            <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 34px; line-height: 1;">Krzysiek</span>
            <span style="font-size: 15px; color: #c9bfa6; margin-top: 4px;">rzuca teraz</span>
          </div>
        </div>
        <div style="display: flex; align-items: flex-end; justify-content: space-between; position: relative;">
          <dl style="margin: 0 0 14px; display: flex; gap: 22px;">
            <div style="display: flex; flex-direction: column; gap: 4px;">
              <dt style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 15px; letter-spacing: 0.18em; color: #a8a08a;">PRÓBY</dt>
              <dd style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 30px; line-height: 1; font-variant-numeric: tabular-nums;">12</dd>
            </div>
            <div style="display: flex; flex-direction: column; gap: 4px;">
              <dt style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 15px; letter-spacing: 0.18em; color: #a8a08a;">UDANE</dt>
              <dd style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 30px; line-height: 1; font-variant-numeric: tabular-nums;">5</dd>
            </div>
          </dl>
          <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 6px;">
            <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 15px; letter-spacing: 0.18em; color: #a8a08a;">SKUTECZNOŚĆ</span>
            <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 128px; line-height: 0.82; font-variant-numeric: tabular-nums; text-shadow: 0 6px 30px rgba(0,0,0,0.6);">42%</span>
          </div>
        </div>
      </div>

      <section aria-labelledby="co-recent" style="flex-grow: 1; min-height: 0; box-sizing: border-box; border-radius: 22px; padding: 20px 22px; background: rgba(243,236,216,0.035); box-shadow: 0 0 0 1px rgba(243,236,216,0.11) inset; display: flex; flex-direction: column; gap: 10px;">
        <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 14px;">
          <h2 id="co-recent" style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 21px; line-height: 1.1;">Ostatnie próby</h2>
          <span style="font-size: 13px; color: #a8a08a;">najnowsza na górze</span>
        </div>
        <ol style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column;">
          <sc-for list="{{recent}}" as="a" hint-placeholder-count="5">
            <li style="height: 56px; display: grid; grid-template-columns: 44px 64px minmax(0, 1fr); align-items: center; gap: 12px; border-top: 1px solid rgba(243,236,216,0.11); font-family: 'Barlow Condensed', sans-serif; font-variant-numeric: tabular-nums;">
              <span style="text-align: right; color: #a8a08a; font-weight: 600; font-size: 19px;">{{a.n}}</span>
              <span style="text-align: right; font-weight: 800; font-size: 28px;">{{a.target}}</span>
              <sc-if value="{{a.success}}" hint-placeholder-val="{{true}}">
                <span style="display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 20px; color: #f3ecd8;"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" fill="#3ddc84"><path d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"></path></svg>Udało się</span>
              </sc-if>
              <sc-if value="{{a.failure}}" hint-placeholder-val="{{false}}">
                <span style="display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 20px; color: #a8a08a;"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" fill="#d8352a"><path d="M6.4 4L12 9.6 17.6 4 20 6.4 14.4 12 20 17.6 17.6 20 12 14.4 6.4 20 4 17.6 9.6 12 4 6.4z"></path></svg>Nie udało się</span>
              </sc-if>
            </li>
          </sc-for>
        </ol>
      </section>
    </section>

    <section style="flex-grow: 1; display: flex; flex-direction: column; gap: 14px; min-width: 0;">
      <section aria-labelledby="co-target" style="flex-grow: 1; min-height: 0; box-sizing: border-box; border-radius: 22px; padding: 28px; background: linear-gradient(180deg, #2a2420 0%, #1b1714 100%); box-shadow: 0 1px 0 rgba(243,236,216,0.11) inset, 0 30px 60px -24px rgba(0,0,0,0.85); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; position: relative; overflow: hidden;">
        <svg width="420" height="420" viewBox="0 0 200 200" aria-hidden="true" style="position: absolute; right: -120px; top: -120px; opacity: 0.07;"><circle cx="100" cy="100" r="95" fill="none" stroke="#f3ecd8" stroke-width="6"></circle><circle cx="100" cy="100" r="58" fill="none" stroke="#f3ecd8" stroke-width="6"></circle><circle cx="100" cy="100" r="22" fill="#f3ecd8"></circle></svg>
        <h2 id="co-target" style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 15px; letter-spacing: 0.18em; color: #a8a08a; position: relative;">KOŃCÓWKA</h2>
        <p style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 220px; line-height: 0.8; font-variant-numeric: tabular-nums; text-shadow: 0 10px 40px rgba(0,0,0,0.6); position: relative;">76</p>
        <div style="display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 16px 22px 20px; border-radius: 18px; background: linear-gradient(135deg, #e8483a 0%, #d8352a 60%, #a8231b 100%); box-shadow: 0 1px 0 rgba(255,255,255,0.25) inset, 0 30px 60px -20px rgba(216,53,42,0.5); color: #fff7e6; position: relative; overflow: hidden;">
          <svg width="160" height="160" viewBox="0 0 200 200" aria-hidden="true" style="position: absolute; right: -50px; top: -50px; opacity: 0.16;"><circle cx="100" cy="100" r="95" fill="none" stroke="#fff7e6" stroke-width="10"></circle><circle cx="100" cy="100" r="58" fill="none" stroke="#fff7e6" stroke-width="10"></circle><circle cx="100" cy="100" r="22" fill="#fff7e6"></circle></svg>
          <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 19px; letter-spacing: 0.16em; position: relative;">ZAMKNIĘCIE W 2 RZUTKACH</span>
          <span style="display: flex; gap: 12px; position: relative;" aria-label="Trasa: T20, D8">
            <span style="background: rgba(0,0,0,0.28); border-radius: 10px; padding: 0 16px; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 72px; line-height: 1.1; white-space: nowrap;">T20</span>
            <span style="background: rgba(0,0,0,0.28); border-radius: 10px; padding: 0 16px; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 72px; line-height: 1.1; white-space: nowrap;">D8</span>
          </span>
        </div>
        <p style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 26px; color: #c9bfa6; font-variant-numeric: tabular-nums; position: relative;">5 z 12 · 42%</p>
      </section>

      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px;">
        <button type="button" aria-keyshortcuts="0" style="position: relative; height: 112px; border: 0; border-radius: 18px; background: linear-gradient(180deg, #2a2420, #1b1714); box-shadow: 0 0 0 2px #d8352a inset, 0 10px 20px -10px rgba(0,0,0,0.9); color: #f3ecd8; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 36px; display: flex; align-items: center; justify-content: center; gap: 14px;"><svg width="30" height="30" viewBox="0 0 24 24" aria-hidden="true" fill="#d8352a"><path d="M6.4 4L12 9.6 17.6 4 20 6.4 14.4 12 20 17.6 17.6 20 12 14.4 6.4 20 4 17.6 9.6 12 4 6.4z"></path></svg>Nie udało się<span aria-hidden="true" style="position: absolute; right: 14px; top: 12px; padding: 3px 8px; border-radius: 8px; background: rgba(243,236,216,0.07); color: #a8a08a; font-family: 'Barlow', sans-serif; font-weight: 500; font-size: 13px;">0</span></button>
        <button type="button" aria-keyshortcuts="Enter 1" style="position: relative; height: 112px; border: 0; border-radius: 18px; background: #f3ecd8; box-shadow: 0 1px 0 rgba(255,255,255,0.5) inset, 0 10px 20px -10px rgba(0,0,0,0.9); color: #0a0908; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 36px; display: flex; align-items: center; justify-content: center; gap: 14px;"><svg width="32" height="32" viewBox="0 0 24 24" aria-hidden="true" fill="#0a0908"><path d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"></path></svg>Udało się<span aria-hidden="true" style="position: absolute; right: 14px; top: 12px; padding: 3px 8px; border-radius: 8px; background: rgba(10,9,8,0.08); color: #3a332c; font-family: 'Barlow', sans-serif; font-weight: 500; font-size: 13px;">Enter / 1</span></button>
        <button type="button" aria-keyshortcuts="N" style="position: relative; height: 64px; border: 0; border-radius: 12px; background: transparent; box-shadow: 0 0 0 1px rgba(243,236,216,0.12) inset; color: #f3ecd8; font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 22px; display: flex; align-items: center; justify-content: center; gap: 10px;"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" fill="#f3ecd8"><path d="M14 4h6v6l-2.3-2.3L5.4 20 4 18.6 16.3 6.3zM4 5.4L5.4 4l5.2 5.2-1.4 1.4zM13.4 14.8l1.4-1.4 3 3L20 14v6h-6l2.4-2.4z"></path></svg>Nowa końcówka<span aria-hidden="true" style="position: absolute; right: 14px; padding: 3px 8px; border-radius: 8px; background: rgba(243,236,216,0.07); color: #a8a08a; font-family: 'Barlow', sans-serif; font-weight: 500; font-size: 13px;">N</span></button>
        <button type="button" aria-keyshortcuts="Backspace" style="position: relative; height: 64px; border: 0; border-radius: 12px; background: transparent; box-shadow: 0 0 0 1px rgba(243,236,216,0.12) inset; color: #f3ecd8; font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 22px; display: flex; align-items: center; justify-content: center; gap: 10px;"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" fill="#f3ecd8"><path d="M9 4L3 9.5 9 15v-4h5a4 4 0 010 8h-3v2h3a6 6 0 000-12H9z"></path></svg>Cofnij<span aria-hidden="true" style="position: absolute; right: 14px; padding: 3px 8px; border-radius: 8px; background: rgba(243,236,216,0.07); color: #a8a08a; font-family: 'Barlow', sans-serif; font-weight: 500; font-size: 13px;">Backspace</span></button>
      </div>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1600,"height":900}}'>
class Component extends DCLogic {
renderVals() {
const wires = Array.from({ length: 20 }, (x, i) => 'rotate(' + (i * 18 + 9) + ')');
const recent = [
['12.', '76', false],
['11.', '85', true],
['10.', '85', false],
['9.', '61', true],
['8.', '100', false]
].map((x) => ({ n: x[0], target: x[1], success: x[2], failure: !x[2] }));
return { wires, recent };
}
}
</script>
</body>
</html>
