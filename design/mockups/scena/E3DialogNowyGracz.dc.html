<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Dialog: nowy gracz</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800;900&amp;family=Barlow:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1600px; height: 900px; box-sizing: border-box; position: relative; overflow: hidden; background: radial-gradient(ellipse 1100px 700px at 30% -15%, #2b201a 0%, #16120f 45%, #0a0908 100%); color: #f3ecd8; font-family: 'Barlow', sans-serif;">

  <div aria-hidden="true" style="position: absolute; inset: 0; display: flex; flex-direction: column;">
    <div style="height: 68px; box-sizing: border-box; padding: 0 28px; display: flex; align-items: center; gap: 14px; border-bottom: 1px solid rgba(243,236,216,0.11);">
      <svg width="32" height="32" viewBox="0 0 34 34"><circle cx="17" cy="17" r="15" fill="#d8352a"></circle><circle cx="17" cy="17" r="10" fill="#0a0908"></circle><circle cx="17" cy="17" r="6" fill="#f3ecd8"></circle><circle cx="17" cy="17" r="2.4" fill="#d8352a"></circle></svg>
      <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 24px; letter-spacing: 0.08em; margin-right: 22px;">AUTO SCORE</span>
      <span style="position: relative; align-self: stretch; display: flex; align-items: center; padding: 0 16px; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 20px;">Nowa gra<span style="position: absolute; left: 12px; right: 12px; bottom: -1px; height: 3px; border-radius: 3px; background: #d8352a;"></span></span>
      <span style="padding: 0 16px; color: #a8a08a; font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 20px;">Statystyki</span>
      <span style="padding: 0 16px; color: #a8a08a; font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 20px;">Historia</span>
      <span style="padding: 0 16px; color: #a8a08a; font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 20px;">Ustawienia</span>
    </div>
    <div style="flex-grow: 1; box-sizing: border-box; padding: 26px 28px 0; display: flex; gap: 28px; min-height: 0;">
      <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 22px;">
        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px;">
          <div style="height: 150px; box-sizing: border-box; border-radius: 22px; padding: 22px 24px; background: linear-gradient(160deg, #2a2420 0%, #1b1714 100%); box-shadow: 0 0 0 2px #d8352a inset; display: flex; flex-direction: column; justify-content: flex-end; gap: 4px;"><span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 34px; line-height: 1;">Mecz 1v1</span><span style="font-size: 15px; color: #c9bfa6;">Dwóch graczy, best of N legów</span></div>
          <div style="height: 150px; box-sizing: border-box; border-radius: 22px; padding: 22px 24px; background: rgba(243,236,216,0.035); box-shadow: 0 0 0 1px rgba(243,236,216,0.11) inset; display: flex; flex-direction: column; justify-content: flex-end; gap: 4px;"><span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 34px; line-height: 1;">Zabawa</span><span style="font-size: 15px; color: #a8a08a;">3-4 graczy, walka o miejsca</span></div>
          <div style="height: 150px; box-sizing: border-box; border-radius: 22px; padding: 22px 24px; background: rgba(243,236,216,0.035); box-shadow: 0 0 0 1px rgba(243,236,216,0.11) inset; display: flex; flex-direction: column; justify-content: flex-end; gap: 4px;"><span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 34px; line-height: 1;">Trening</span><span style="font-size: 15px; color: #a8a08a;">Solo: Free run, 501, końcówki</span></div>
        </div>
        <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 22px;">Gracze</span>
        <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px;">
          <sc-for list="{{bgPlayers}}" as="p" hint-placeholder-count="4">
            <div style="height: 76px; box-sizing: border-box; border-radius: 18px; padding: 0 16px; background: rgba(243,236,216,0.035); box-shadow: 0 0 0 1px rgba(243,236,216,0.11) inset; display: flex; align-items: center; gap: 12px;"><span style="{{p.avatar}}">{{p.initial}}</span><span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 23px;">{{p.name}}</span></div>
          </sc-for>
          <div style="height: 76px; border-radius: 18px; box-shadow: 0 0 0 1px rgba(243,236,216,0.11) inset; color: #c9bfa6; display: flex; align-items: center; justify-content: center; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 21px;">+ Nowy gracz</div>
        </div>
        <div style="display: flex; gap: 40px;">
          <div style="width: 320px; height: 60px; border-radius: 16px; background: rgba(243,236,216,0.035); box-shadow: 0 0 0 1px rgba(243,236,216,0.11) inset;"></div>
          <div style="width: 380px; height: 60px; border-radius: 16px; background: rgba(243,236,216,0.035); box-shadow: 0 0 0 1px rgba(243,236,216,0.11) inset;"></div>
        </div>
      </div>
      <div style="width: 420px; display: flex; flex-direction: column; gap: 16px;">
        <div style="height: 260px; border-radius: 22px; background: linear-gradient(180deg, #2a2420 0%, #1b1714 100%);"></div>
        <div style="flex-grow: 1; border-radius: 22px; background: rgba(243,236,216,0.035); box-shadow: 0 0 0 1px rgba(243,236,216,0.11) inset;"></div>
      </div>
    </div>
    <div style="height: 96px; box-sizing: border-box; padding: 0 28px; display: flex; align-items: center; justify-content: flex-end;">
      <span style="height: 64px; padding: 0 34px; border-radius: 18px; background: linear-gradient(135deg, #e8483a 0%, #d8352a 60%, #a8231b 100%); color: #fff7e6; font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 28px; letter-spacing: 0.06em; display: flex; align-items: center;">START GRY</span>
    </div>
  </div>

  <div style="position: absolute; inset: 0; background: rgba(10,9,8,0.8); display: flex; align-items: center; justify-content: center; padding: 28px; box-sizing: border-box;">
    <div role="dialog" aria-modal="true" aria-labelledby="np-title" style="position: relative; width: 640px; box-sizing: border-box; border-radius: 22px; padding: 30px 32px 28px; background: linear-gradient(180deg, #2a2420 0%, #1b1714 100%); box-shadow: 0 1px 0 rgba(243,236,216,0.11) inset, 0 30px 60px -24px rgba(0,0,0,0.85), 0 0 0 1px rgba(243,236,216,0.11); display: flex; flex-direction: column; gap: 22px; overflow: hidden;">
      <svg width="240" height="240" viewBox="0 0 200 200" aria-hidden="true" style="position: absolute; right: -80px; top: -80px; opacity: 0.07;"><circle cx="100" cy="100" r="95" fill="none" stroke="#f3ecd8" stroke-width="8"></circle><circle cx="100" cy="100" r="58" fill="none" stroke="#f3ecd8" stroke-width="8"></circle><circle cx="100" cy="100" r="22" fill="#f3ecd8"></circle></svg>
      <h2 id="np-title" style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 40px; line-height: 1; letter-spacing: 0.01em; text-transform: uppercase; position: relative;">Nowy gracz</h2>
      <form style="display: flex; flex-direction: column; gap: 20px; position: relative;">
        <div style="display: flex; flex-direction: column; gap: 10px;">
          <label style="display: flex; flex-direction: column; gap: 8px;">
            <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 15px; line-height: 1; letter-spacing: 0.18em; color: #a8a08a;">IMIĘ</span>
            <input value="Szymon" maxlength="40" aria-invalid="true" aria-describedby="np-name-error" style="height: 56px; box-sizing: border-box; border: 0; border-radius: 12px; padding: 0 16px; background: rgba(10,9,8,0.55); box-shadow: 0 0 0 2px #d8352a inset; color: #f3ecd8; font-family: 'Barlow', sans-serif; font-size: 22px; outline: none;">
          </label>
          <p id="np-name-error" style="margin: 0; display: flex; align-items: center; gap: 10px; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 20px; color: #f3ecd8;"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" fill="#d8352a"><path d="M12 2l10 19H2zm-1 7v6h2V9zm0 8v2h2v-2z"></path></svg>Gracz o imieniu „Szymon” już istnieje</p>
        </div>
        <label style="display: flex; flex-direction: column; gap: 8px;">
          <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 15px; line-height: 1; letter-spacing: 0.18em; color: #a8a08a;">AVATAR (EMOJI)</span>
          <input value="🦊" maxlength="16" style="width: 112px; height: 56px; box-sizing: border-box; border: 0; border-radius: 12px; padding: 0 16px; background: rgba(10,9,8,0.55); box-shadow: 0 0 0 1px rgba(243,236,216,0.12) inset; color: #f3ecd8; font-family: 'Barlow', sans-serif; font-size: 26px; outline: none;">
        </label>
        <div style="display: flex; align-items: center; gap: 22px;">
          <span aria-hidden="true" style="width: 84px; height: 84px; flex-shrink: 0; border-radius: 50%; background: #2fc6c6; display: flex; align-items: center; justify-content: center; font-size: 40px; box-shadow: 0 0 0 4px #1b1714, 0 0 0 6px #2fc6c6, 0 0 30px rgba(47,198,198,0.4);">🦊</span>
          <fieldset style="margin: 0; padding: 0; border: 0; min-width: 0; flex-grow: 1; display: flex; flex-direction: column; gap: 10px;">
            <legend style="padding: 0; margin-bottom: 10px; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 15px; line-height: 1; letter-spacing: 0.18em; color: #a8a08a;">KOLOR</legend>
            <div style="display: grid; grid-template-columns: repeat(8, 44px); gap: 12px;">
              <sc-for list="{{swatches}}" as="s" hint-placeholder-count="16">
                <label style="position: relative; width: 44px; height: 44px; display: flex; cursor: pointer;">
                  <input type="radio" name="np-color" value="{{s.value}}" checked="{{s.checked}}" aria-label="{{s.name}}" style="position: absolute; inset: 0; width: 44px; height: 44px; margin: 0; opacity: 0; cursor: pointer;">
                  <span aria-hidden="true" style="{{s.style}}">
                    <sc-if value="{{s.checked}}" hint-placeholder-val="{{false}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="#111111"><path d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"></path></svg></sc-if>
                  </span>
                </label>
              </sc-for>
            </div>
          </fieldset>
        </div>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 6px;">
          <button type="submit" style="height: 60px; border: 0; border-radius: 12px; background: linear-gradient(135deg, #e8483a 0%, #d8352a 60%, #a8231b 100%); box-shadow: 0 1px 0 rgba(255,255,255,0.25) inset, 0 30px 60px -20px rgba(216,53,42,0.5); color: #fff7e6; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 26px; cursor: pointer;">Dodaj</button>
          <button type="button" style="height: 60px; border: 0; border-radius: 12px; background: rgba(243,236,216,0.07); box-shadow: 0 1px 0 rgba(243,236,216,0.11) inset; color: #f3ecd8; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 24px; cursor: pointer;">Anuluj</button>
        </div>
      </form>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1600,"height":900}}'>
class Component extends DCLogic {
renderVals() {
const colors = ['#f2b134', '#5aa9ff', '#b28cff', '#ff7f6e', '#4cc38a', '#2fc6c6', '#ff70b8', '#e3d84a', '#8fd14f', '#ff8a1c', '#f0a6e6', '#86d8f5', '#d6b98c', '#d4d4d4', '#b9c46a', '#f2a3a3'];
const names = ['Bursztynowy', 'Niebieski', 'Fioletowy', 'Koralowy', 'Zielony', 'Turkusowy', 'Różowy', 'Żółty', 'Limonkowy', 'Pomarańczowy', 'Liliowy', 'Błękitny', 'Piaskowy', 'Srebrny', 'Oliwkowy', 'Łososiowy'];
const selected = 6;
const swatches = colors.map((c, i) => {
const checked = i + 1 === selected;
return {
value: String(i + 1), name: names[i], checked,
style: 'pointer-events: none; width: 44px; height: 44px; border-radius: 50%; background: ' + c + '; display: flex; align-items: center; justify-content: center;' + (checked ? ' box-shadow: 0 0 0 3px #1b1714, 0 0 0 6px #f3ecd8;' : ' box-shadow: 0 1px 0 rgba(255,255,255,0.25) inset;')
};
});
const av = (bg) => 'width: 46px; height: 46px; border-radius: 50%; background: ' + bg + '; color: #111111; display: flex; align-items: center; justify-content: center; font-family: Barlow Condensed, sans-serif; font-weight: 700; font-size: 20px;';
const bgPlayers = [
{ name: 'Szymon', initial: 'S', avatar: av('#5aa9ff') },
{ name: 'Krzysiek', initial: 'XD', avatar: av('#ff70b8') },
{ name: 'Grzesiek', initial: 'G', avatar: av('#b28cff') },
{ name: 'Dzimi', initial: 'D', avatar: av('#f2b134') }
];
return { swatches, bgPlayers };
}
}
</script>
</body>
</html>
