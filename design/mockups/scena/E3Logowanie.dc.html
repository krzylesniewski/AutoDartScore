<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Logowanie</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800;900&amp;family=Barlow:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<main style="width: 1600px; height: 900px; box-sizing: border-box; position: relative; overflow: hidden; background: radial-gradient(ellipse 1000px 700px at 50% -10%, #2b201a 0%, #16120f 45%, #0a0908 100%); color: #f3ecd8; font-family: 'Barlow', sans-serif; display: flex; align-items: center; justify-content: center;">
  <svg width="1000" height="1000" viewBox="-500 -500 1000 1000" aria-hidden="true" style="position: absolute; left: 300px; top: -50px; opacity: 0.07;">
    <circle r="490" fill="none" stroke="#f3ecd8" stroke-width="1"></circle>
    <circle r="455" fill="none" stroke="#f3ecd8" stroke-width="1"></circle>
    <circle r="430" fill="none" stroke="#f3ecd8" stroke-width="1"></circle>
    <circle r="270" fill="none" stroke="#f3ecd8" stroke-width="1"></circle>
    <circle r="252" fill="none" stroke="#f3ecd8" stroke-width="1"></circle>
    <circle r="40" fill="none" stroke="#f3ecd8" stroke-width="1"></circle>
    <circle r="16" fill="none" stroke="#f3ecd8" stroke-width="1"></circle>
    <sc-for list="{{wires}}" as="w" hint-placeholder-count="20"><line x1="0" y1="-40" x2="0" y2="-490" stroke="#f3ecd8" stroke-width="1" transform="{{w}}"></line></sc-for>
  </svg>

  <div style="position: relative; width: 460px; box-sizing: border-box; border-radius: 22px; padding: 34px 34px 32px; background: linear-gradient(180deg, #2a2420 0%, #1b1714 100%); box-shadow: 0 1px 0 rgba(243,236,216,0.11) inset, 0 30px 60px -24px rgba(0,0,0,0.85), 0 0 0 1px rgba(243,236,216,0.11); display: flex; flex-direction: column; gap: 28px; overflow: hidden;">
    <svg width="260" height="260" viewBox="0 0 200 200" aria-hidden="true" style="position: absolute; right: -80px; top: -80px; opacity: 0.07;"><circle cx="100" cy="100" r="95" fill="none" stroke="#f3ecd8" stroke-width="8"></circle><circle cx="100" cy="100" r="58" fill="none" stroke="#f3ecd8" stroke-width="8"></circle><circle cx="100" cy="100" r="22" fill="#f3ecd8"></circle></svg>
    <h1 style="margin: 0; display: flex; align-items: center; gap: 14px; position: relative;">
      <svg width="44" height="44" viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="17" r="15" fill="#d8352a"></circle><circle cx="17" cy="17" r="10" fill="#0a0908"></circle><circle cx="17" cy="17" r="6" fill="#f3ecd8"></circle><circle cx="17" cy="17" r="2.4" fill="#d8352a"></circle></svg>
      <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 34px; line-height: 1; letter-spacing: 0.08em;">AUTO SCORE</span>
    </h1>
    <form style="display: flex; flex-direction: column; gap: 16px; position: relative;">
      <label style="display: flex; flex-direction: column; gap: 8px;">
        <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 15px; line-height: 1; letter-spacing: 0.18em; color: #a8a08a;">HASŁO</span>
        <input type="password" autocomplete="current-password" maxlength="200" value="lotka2026" aria-invalid="true" aria-describedby="login-error" style="height: 56px; box-sizing: border-box; border: 0; border-radius: 12px; padding: 0 16px; background: rgba(10,9,8,0.55); box-shadow: 0 0 0 2px #d8352a inset; color: #f3ecd8; font-family: 'Barlow', sans-serif; font-size: 22px; letter-spacing: 0.12em; outline: none;">
      </label>
      <p id="login-error" role="alert" style="margin: 0; display: flex; align-items: center; gap: 10px; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 20px; color: #f3ecd8;"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" fill="#d8352a"><path d="M12 2l10 19H2zm-1 7v6h2V9zm0 8v2h2v-2z"></path></svg>Nieprawidłowe hasło</p>
      <button type="submit" style="height: 60px; margin-top: 6px; border: 0; border-radius: 12px; background: linear-gradient(135deg, #e8483a 0%, #d8352a 60%, #a8231b 100%); box-shadow: 0 1px 0 rgba(255,255,255,0.25) inset, 0 30px 60px -20px rgba(216,53,42,0.5); color: #fff7e6; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 26px; letter-spacing: 0.04em; cursor: pointer;">Zaloguj</button>
    </form>
  </div>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1600,"height":900}}'>
class Component extends DCLogic {
renderVals() {
const wires = Array.from({ length: 20 }, (x, i) => 'rotate(' + (i * 18 + 9) + ')');
return { wires };
}
}
</script>
</body>
</html>
