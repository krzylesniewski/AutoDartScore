<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Trening Free run</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800;900&amp;family=Barlow:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1600px; height: 900px; box-sizing: border-box; position: relative; overflow: hidden; background: radial-gradient(ellipse 1000px 700px at 62% -10%, #2b201a 0%, #16120f 45%, #0a0908 100%); color: #f3ecd8; font-family: 'Barlow', sans-serif; display: flex; flex-direction: column;">
  <svg width="1000" height="1000" viewBox="-500 -500 1000 1000" aria-hidden="true" style="position: absolute; left: 640px; top: 260px; opacity: 0.07;">
    <circle r="490" fill="none" stroke="#f3ecd8" stroke-width="1"></circle>
    <circle r="455" fill="none" stroke="#f3ecd8" stroke-width="1"></circle>
    <circle r="430" fill="none" stroke="#f3ecd8" stroke-width="1"></circle>
    <circle r="270" fill="none" stroke="#f3ecd8" stroke-width="1"></circle>
    <circle r="252" fill="none" stroke="#f3ecd8" stroke-width="1"></circle>
    <sc-for list="{{wires}}" as="w" hint-placeholder-count="20"><line x1="0" y1="-275" x2="0" y2="-490" stroke="#f3ecd8" stroke-width="1" transform="{{w}}"></line></sc-for>
  </svg>

  <header style="position: relative; height: 68px; box-sizing: border-box; padding: 0 28px; display: flex; align-items: center; gap: 14px;">
    <a href="#" aria-label="Ekran startowy" style="display: flex; align-items: center; gap: 14px; color: #f3ecd8; text-decoration: none;">
      <svg width="32" height="32" viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="17" r="15" fill="#d8352a"></circle><circle cx="17" cy="17" r="10" fill="#0a0908"></circle><circle cx="17" cy="17" r="6" fill="#f3ecd8"></circle><circle cx="17" cy="17" r="2.4" fill="#d8352a"></circle></svg>
      <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 24px; letter-spacing: 0.08em;">AUTO SCORE</span>
    </a>
    <span style="width: 1px; height: 24px; background: rgba(243,236,216,0.11); margin: 0 8px;"></span>
    <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 19px; color: #c9bfa6;">Trening · Free run</span>
    <span style="flex-grow: 1;"></span>
    <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 19px; color: #c9bfa6;">Kolejka 7</span>
    <span role="timer" aria-label="Czas sesji 4 minuty 12 sekund" style="display: inline-flex; align-items: center; gap: 8px; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 19px; background: rgba(243,236,216,0.07); padding: 6px 12px; border-radius: 999px; font-variant-numeric: tabular-nums;"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" fill="#a8a08a"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 2a8 8 0 1 1 0 16 8 8 0 0 1 0-16zm-1 3v6.4l5.2 3.1 1-1.7-4.2-2.5V7z"></path></svg>4:12</span>
    <span style="flex-grow: 1;"></span>
    <button type="button" style="height: 44px; padding: 0 16px; border: 0; border-radius: 12px; background: transparent; box-shadow: 0 0 0 1px rgba(243,236,216,0.12) inset; color: #f3ecd8; font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 19px; display: flex; align-items: center; gap: 8px;"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" fill="#f3ecd8"><path d="M6 6h12v12H6z"></path></svg>Zakończ trening</button>
    <button type="button" aria-label="Głos: włączony" aria-pressed="true" style="width: 44px; height: 44px; background: rgba(243,236,216,0.07); border: 0; border-radius: 999px; display: flex; align-items: center; justify-content: center;"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" fill="#f3ecd8"><path d="M3 9h4l5-5v16l-5-5H3zm11-1v8a4.5 4.5 0 000-8zm0-4.8v2.1a7 7 0 010 13.4v2.1a9 9 0 000-17.6z"></path></svg></button>
    <button type="button" aria-label="Efekty dźwiękowe: włączone" aria-pressed="true" style="width: 44px; height: 44px; background: rgba(243,236,216,0.07); border: 0; border-radius: 999px; display: flex; align-items: center; justify-content: center;"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" fill="#f3ecd8"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"></path></svg></button>
  </header>

  <main style="position: relative; flex-grow: 1; box-sizing: border-box; padding: 8px 28px 28px; display: flex; gap: 28px; min-height: 0;">
    <section aria-label="Wyniki" style="width: 450px; display: flex; flex-direction: column; gap: 14px;">
      <div style="height: 240px; box-sizing: border-box; border-radius: 18px; padding: 24px 28px; background: linear-gradient(180deg, #2a2420 0%, #1b1714 100%); box-shadow: 0 1px 0 rgba(243,236,216,0.11) inset, 0 24px 48px -16px rgba(0,0,0,0.8), 0 0 0 1px rgba(243,236,216,0.11); display: flex; flex-direction: column; justify-content: space-between; position: relative; overflow: hidden;">
        <svg width="260" height="260" viewBox="0 0 200 200" aria-hidden="true" style="position: absolute; right: -70px; top: -70px; opacity: 0.07;"><circle cx="100" cy="100" r="95" fill="none" stroke="#f3ecd8" stroke-width="8"></circle><circle cx="100" cy="100" r="58" fill="none" stroke="#f3ecd8" stroke-width="8"></circle><circle cx="100" cy="100" r="22" fill="#f3ecd8"></circle></svg>
        <div style="display: flex; align-items: center; gap: 14px; position: relative;">
          <span style="width: 58px; height: 58px; border-radius: 50%; background: #5aa9ff; color: #111111; display: flex; align-items: center; justify-content: center; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 28px; box-shadow: 0 0 0 3px #1b1714, 0 0 0 5px #5aa9ff, 0 0 24px 2px rgba(90,169,255,0.45);">S</span>
          <div style="display: flex; flex-direction: column;">
            <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 34px; line-height: 1;">Szymon</span>
            <span style="font-size: 15px; color: #c9bfa6; margin-top: 4px;">rzuca teraz · rzutka 2 z 3</span>
          </div>
        </div>
        <div style="display: flex; align-items: flex-end; justify-content: space-between; position: relative;">
          <dl style="margin: 0 0 14px; display: flex; gap: 22px;">
            <div style="display: flex; flex-direction: column; gap: 4px;">
              <dt style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 15px; letter-spacing: 0.18em; color: #a8a08a;">RZUTKI</dt>
              <dd style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 30px; line-height: 1; font-variant-numeric: tabular-nums;">19</dd>
            </div>
            <div style="display: flex; flex-direction: column; gap: 4px;">
              <dt style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 15px; letter-spacing: 0.18em; color: #a8a08a;">ŚREDNIA</dt>
              <dd style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 30px; line-height: 1; font-variant-numeric: tabular-nums;">46,7</dd>
            </div>
          </dl>
          <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 6px;">
            <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 15px; letter-spacing: 0.18em; color: #a8a08a;">SUMA</span>
            <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 128px; line-height: 0.82; font-variant-numeric: tabular-nums; text-shadow: 0 6px 30px rgba(0,0,0,0.6);">296</span>
          </div>
        </div>
      </div>

      <section aria-labelledby="fr-history" style="flex-grow: 1; min-height: 0; box-sizing: border-box; border-radius: 22px; padding: 20px 22px; background: rgba(243,236,216,0.035); box-shadow: 0 0 0 1px rgba(243,236,216,0.11) inset; display: flex; flex-direction: column; gap: 10px; position: relative; overflow: hidden;">
        <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 14px;">
          <h2 id="fr-history" style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 21px; line-height: 1.1;">Przebieg sesji</h2>
          <span style="font-size: 13px; color: #a8a08a;">rzutki i punkty w turze</span>
        </div>
        <table style="width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums;">
          <thead>
            <tr>
              <th scope="col" style="padding: 8px 0; width: 60px; text-align: left; color: #a8a08a; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 17px;">Tura</th>
              <th scope="col" style="padding: 8px 0; text-align: left; color: #a8a08a; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 17px;">Rzutki</th>
              <th scope="col" style="padding: 8px 0; text-align: right; color: #a8a08a; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 17px;">Punkty</th>
            </tr>
          </thead>
          <tbody>
            <sc-for list="{{turns}}" as="t" hint-placeholder-count="7">
              <tr>
                <td style="{{t.cellNo}}">{{t.n}}</td>
                <td style="{{t.cellDarts}}">{{t.darts}}</td>
                <td style="{{t.cellPts}}">{{t.pts}}</td>
              </tr>
            </sc-for>
          </tbody>
        </table>
      </section>
    </section>

    <section style="flex-grow: 1; display: flex; flex-direction: column; gap: 18px; min-width: 0;">
      <ol aria-label="Bieżąca tura" style="margin: 0; padding: 0; list-style: none; display: flex; gap: 14px; height: 120px;">
        <li aria-label="Rzutka 1: S20, 20 punktów" style="flex: 1; border-radius: 18px; background: rgba(243,236,216,0.07); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;">
          <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 56px; line-height: 1;">S20</span>
          <span style="font-size: 14px; color: #a8a08a;">20</span>
        </li>
        <li aria-label="Rzutka 2: czeka na rzutkę" style="flex: 1; border-radius: 18px; background: rgba(243,236,216,0.035); box-shadow: 0 0 0 1px #d8352a inset, 0 0 40px -10px rgba(216,53,42,0.5) inset; display: flex; align-items: center; justify-content: center; gap: 14px;">
          <svg width="40" height="40" viewBox="0 0 56 56" aria-hidden="true"><circle cx="28" cy="28" r="26" fill="none" stroke="#d8352a" stroke-opacity="0.4" stroke-width="2"></circle><circle cx="28" cy="28" r="15" fill="none" stroke="#d8352a" stroke-opacity="0.7" stroke-width="2"></circle><circle cx="28" cy="28" r="5" fill="#d8352a"></circle></svg>
          <span style="font-size: 17px; color: #c9bfa6;">rzutka 2</span>
        </li>
        <li aria-label="Rzutka 3" style="flex: 1; border-radius: 18px; background: rgba(243,236,216,0.035);"></li>
        <li style="width: 150px; display: flex; flex-direction: column; align-items: flex-end; justify-content: center; padding-right: 6px;">
          <span style="font-size: 15px; color: #a8a08a;">w tej turze</span>
          <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 72px; line-height: 1; font-variant-numeric: tabular-nums;">20</span>
        </li>
      </ol>

      <section aria-label="Klawiatura rzutek" style="flex-grow: 1; display: flex; gap: 20px; min-height: 0;">
        <div role="group" aria-label="Mnożnik" style="width: 130px; display: flex; flex-direction: column; gap: 6px; padding: 6px; box-sizing: border-box; border-radius: 18px; background: rgba(243,236,216,0.07);">
          <button type="button" aria-pressed="true" aria-keyshortcuts="S" style="position: relative; flex: 1; min-height: 72px; background: #f3ecd8; color: #0a0908; border: 0; border-radius: 13px; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 24px; box-shadow: 0 8px 20px -8px rgba(0,0,0,0.7);">Single<span aria-hidden="true" style="position: absolute; top: 7px; right: 10px; font-family: 'Barlow', sans-serif; font-weight: 500; font-size: 12px; line-height: 1; opacity: 0.7; pointer-events: none;">S</span></button>
          <button type="button" aria-pressed="false" aria-keyshortcuts="D" style="position: relative; flex: 1; min-height: 72px; background: transparent; color: #f3ecd8; border: 0; border-radius: 13px; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 24px;">Double<span aria-hidden="true" style="position: absolute; top: 7px; right: 10px; font-family: 'Barlow', sans-serif; font-weight: 500; font-size: 12px; line-height: 1; opacity: 0.7; pointer-events: none;">D</span></button>
          <button type="button" aria-pressed="false" aria-keyshortcuts="T" style="position: relative; flex: 1; min-height: 72px; background: transparent; color: #f3ecd8; border: 0; border-radius: 13px; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 24px;">Treble<span aria-hidden="true" style="position: absolute; top: 7px; right: 10px; font-family: 'Barlow', sans-serif; font-weight: 500; font-size: 12px; line-height: 1; opacity: 0.7; pointer-events: none;">T</span></button>
        </div>
        <div style="flex-grow: 1; display: flex; align-items: center; justify-content: center;">
          <div style="position: relative; width: 600px; height: 600px; border-radius: 50%; background: radial-gradient(circle, rgba(243,236,216,0.03) 0%, rgba(243,236,216,0) 70%);">
            <svg width="600" height="600" viewBox="0 0 600 600" aria-hidden="true" style="position: absolute; left: 0; top: 0;"><circle cx="300" cy="300" r="296" fill="none" stroke="rgba(243,236,216,0.11)" stroke-width="1"></circle><circle cx="300" cy="300" r="204" fill="none" stroke="rgba(243,236,216,0.11)" stroke-width="1" stroke-dasharray="2 8"></circle></svg>
            <sc-for list="{{ring}}" as="n" hint-placeholder-count="20">
              <button type="button" style="{{n.style}}">{{n.label}}</button>
            </sc-for>
            <div style="position: absolute; left: 180px; top: 250px; width: 240px; display: flex; gap: 12px;">
              <button type="button" aria-keyshortcuts="B" style="position: relative; flex: 1; height: 100px; background: linear-gradient(180deg, #2a2420, #1b1714); color: #f3ecd8; border: 0; border-radius: 50px; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 34px; box-shadow: 0 1px 0 rgba(243,236,216,0.11) inset, 0 10px 20px -10px rgba(0,0,0,0.9);">25<span aria-hidden="true" style="position: absolute; top: 7px; right: 10px; font-family: 'Barlow', sans-serif; font-weight: 500; font-size: 12px; line-height: 1; opacity: 0.7; pointer-events: none;">B</span></button>
              <button type="button" aria-keyshortcuts="Shift+B" style="position: relative; flex: 1; height: 100px; background: linear-gradient(180deg, #2a2420, #1b1714); color: #f3ecd8; border: 0; border-radius: 50px; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 34px; box-shadow: 0 0 0 2px #d8352a inset, 0 10px 20px -10px rgba(0,0,0,0.9);">Bull<span aria-hidden="true" style="position: absolute; top: 7px; right: 10px; font-family: 'Barlow', sans-serif; font-weight: 500; font-size: 12px; line-height: 1; opacity: 0.7; pointer-events: none;">Shift+B</span></button>
            </div>
          </div>
        </div>
        <div style="width: 280px; display: flex; flex-direction: column; gap: 10px;">
          <span style="font-size: 14px; color: #a8a08a;">Najczęściej trafia Szymon</span>
          <div role="group" aria-label="Najczęstsze: Szymon" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px;">
            <sc-for list="{{frequent}}" as="f" hint-placeholder-count="6">
              <button type="button" style="height: 54px; background: rgba(243,236,216,0.07); color: #f3ecd8; border: 0; border-radius: 12px; box-shadow: 0 1px 0 rgba(243,236,216,0.11) inset; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 21px;">{{f}}</button>
            </sc-for>
          </div>
          <button type="button" aria-keyshortcuts="Space" style="position: relative; flex-grow: 1; background: rgba(243,236,216,0.07); color: #f3ecd8; border: 0; border-radius: 18px; box-shadow: 0 1px 0 rgba(243,236,216,0.11) inset; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 36px;">Miss<span aria-hidden="true" style="position: absolute; top: 7px; right: 10px; font-family: 'Barlow', sans-serif; font-weight: 500; font-size: 12px; line-height: 1; opacity: 0.7; pointer-events: none;">Spacja</span></button>
          <button type="button" style="height: 54px; background: transparent; color: #c9bfa6; border: 0; box-shadow: 0 0 0 1px rgba(243,236,216,0.12) inset; border-radius: 12px; font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 19px;">Reszta tury: Miss</button>
          <button type="button" aria-keyshortcuts="Backspace" style="position: relative; height: 54px; background: transparent; color: #f3ecd8; border: 0; box-shadow: 0 0 0 1px rgba(243,236,216,0.12) inset; border-radius: 12px; font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 19px; display: flex; align-items: center; justify-content: center; gap: 8px;"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" fill="#f3ecd8"><path d="M9 4L3 9.5 9 15v-4h5a4 4 0 010 8h-3v2h3a6 6 0 000-12H9z"></path></svg>Cofnij<span aria-hidden="true" style="position: absolute; top: 7px; right: 10px; font-family: 'Barlow', sans-serif; font-weight: 500; font-size: 12px; line-height: 1; opacity: 0.7; pointer-events: none;">Backspace</span></button>
        </div>
      </section>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1600,"height":900}}'>
class Component extends DCLogic {
renderVals() {
const order = [20, 1, 18, 4, 13, 6, 10, 15, 2, 17, 3, 19, 7, 16, 8, 11, 14, 9, 12, 5];
const size = 76, r = 252, c = 300;
const ring = order.map((n, i) => {
const a = (i * 18) * Math.PI / 180;
const left = Math.round(c + r * Math.sin(a) - size / 2);
const top = Math.round(c - r * Math.cos(a) - size / 2);
return {
label: String(n),
style: 'position: absolute; left: ' + left + 'px; top: ' + top + 'px; width: ' + size + 'px; height: ' + size + 'px; border-radius: 50%; background: linear-gradient(180deg, #2a2420, #1b1714); color: #f3ecd8; border: 0; box-shadow: 0 1px 0 rgba(243,236,216,0.11) inset, 0 10px 20px -10px rgba(0,0,0,0.9); font-family: Barlow Condensed, sans-serif; font-weight: 700; font-size: 32px;'
};
});
const wires = order.map((n, i) => 'rotate(' + (i * 18 + 9) + ')');
const rows = [
['1', 'S20 · S1 · S5', '26'],
['2', 'T20 · S20 · S1', '81'],
['3', 'S5 · S20 · S20', '45'],
['4', 'S1 · S18 · S4', '23'],
['5', 'T20 · S5 · S20', '85'],
['6', 'S1 · S5 · S10', '16'],
['7', 'S20 · …', '20']
];
const turns = rows.map((x, i) => {
const current = i === rows.length - 1;
const bg = current ? ' background: rgba(243,236,216,0.035);' : '';
const base = 'padding: 8px 0; border-top: 1px solid rgba(243,236,216,0.11);' + bg;
return {
n: x[0], darts: x[1], pts: x[2],
cellNo: base + ' color: #a8a08a; font-family: Barlow Condensed, sans-serif; font-weight: 700; font-size: 19px; padding-left: 4px;',
cellDarts: base + ' color: #c9bfa6; font-family: Barlow Condensed, sans-serif; font-weight: 600; font-size: 19px;',
cellPts: base + ' text-align: right; font-family: Barlow Condensed, sans-serif; font-weight: 700; font-size: 21px; padding-right: 4px;' + (current ? ' color: #c9bfa6;' : '')
};
});
return { ring, wires, turns, frequent: ['S20', 'S1', 'S5', 'T20', 'S18', 'S4'] };
}
}
</script>
</body>
</html>
