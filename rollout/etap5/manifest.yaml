# AutoScore Dart: Etap 5 (turnieje) jako seria PR-ów T1-T19.
# Źródło: CLAUDE.md, design/plan-etap5.md, design/mockups/turnieje/ (makiety).
# Opis pól: ~/.claude/skills/rollout/docs/manifest.html
# Ten plik jest w repo; ~/.rollouts/autoscore-etap5/manifest.yaml to dowiązanie do niego.
# Stan rolloutu (ledger, logi, inbox, briefy) zostaje w ~/.rollouts/autoscore-etap5/.
rollout: autoscore-etap5
model: opus
claudeBin: ~/.nvm/versions/node/v24.22.2/bin/claude

repo:
  path: ~/Documents/00_Nauka/AutoScoreDart
  github: krzylesniewski/AutoDartScore
  # Gałąź integracyjna etapu 5: do main wchodzi PR-em autora po każdym kamieniu milowym.
  base: feat/tournaments
  public: true
  pathPrepend: [~/.nvm/versions/node/v24.22.0/bin]
  install: pnpm install --frozen-lockfile
  requiredChecks: ['test', 'typecheck', 'lint', 'build', 'smoke', 'e2e'] # joby z .github/workflows/ci.yml
  maintainers: [KrzysztofLesniewski]
  merge: { method: squash, admin: false }
  # Plan, decyzje i źródła wyglądu trzyma człowiek; agenci ich nie zmieniają.
  forbid:
    - auto-score-dart-pomysly.md
    - CLAUDE.md
    - 'rollout/**'
    - 'fixtures/**'
    - design/plan-etap5.md
    - 'design/scena/**'
    - 'design/mockups/**'
  alwaysInScope:
    - pnpm-lock.yaml
  denylist: [/Users/]
  verify:
    common:
      - pnpm install --frozen-lockfile
      - pnpm test
      - pnpm typecheck
      - pnpm lint

briefing:
  sources:
    - title: CLAUDE.md (zasady, stack, reguły X01, front, konwencje; wiążące)
      path: ~/Documents/00_Nauka/AutoScoreDart/CLAUDE.md
      kind: markdown
    - title: Etap 5, decyzje o turniejach i plan PR-ów T1-T19 (wiążący)
      path: ~/Documents/00_Nauka/AutoScoreDart/design/plan-etap5.md
      kind: markdown
    # Tylko dla PR-ów z briefTags: [web].
    - title: Makiety etapu 5, spis ekranów i co makiety wiążą (pliki .dc.html w tym samym katalogu)
      path: ~/Documents/00_Nauka/AutoScoreDart/design/mockups/turnieje/README.md
      kind: markdown
      tag: web
    - title: RWD ekranów, wspólne zasady układu (wiążące dla zmian we froncie)
      path: ~/Documents/00_Nauka/AutoScoreDart/design/rwd.md
      kind: markdown
      tag: web
    - title: Design system „Scena”, zasady użycia tokenów i komponentów (wiążące dla wyglądu)
      path: ~/Documents/00_Nauka/AutoScoreDart/design/scena/README.md
      kind: markdown
      tag: web

policy:
  concurrency: 4
  # Do potwierdzenia przez autora (pytanie 3 w planie): auto jak w etapach 3 i 4 czy akceptacja każdego PR-a.
  merge: auto
  # Agent odpowiada na pytania z briefu tylko tym, co rozstrzyga plan; reszta trafia do autora.
  delegate: {}

# Małe kroki: plik spoza zakresu PR-a wraca do implementera przed weryfikacją.
gates:
  preVerify:
    scope: true

# K1 (T1-T11): rdzeń. K2 (T12-T17): podgląd. K3 (T18-T19): na żywo. Po kamieniu feat/tournaments → main PR-em autora.
prs:
  # K1: rdzeń
  - id: T1
    branch: feat/legs-to-win
    title: 'feat: match length as first to N legs in the engine and the match contract'
    brief: briefs/T1.md
    priority: 90
    effort: { brief: high, implement: high, verify: high }
    changeset: none
    scope: ['packages/engine/**', 'packages/schema/**', 'packages/server/**', 'packages/web/**', 'README.md', 'packages/*/README.md']

  - id: T2
    branch: feat/schema-tournament
    title: 'feat(schema): tournament contract (config, fixtures, standings, view, commands)'
