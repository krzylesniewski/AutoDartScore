# AutoScore Dart: Etap 1 (Mac bez kamery) jako seria PR-ów.
# Źródło: CLAUDE.md i auto-score-dart-pomysly.md (sekcja "Realizacja przez claude-rollout").
# Opis pól: ~/.claude/skills/rollout/docs/manifest.html
# Ten plik jest w repo; ~/.rollouts/autoscore-etap1/manifest.yaml to dowiązanie do niego.
# Stan rolloutu (ledger, logi, inbox, briefy) zostaje w ~/.rollouts/autoscore-etap1/.
rollout: autoscore-etap1
model: opus
# claude jest binarką natywną zainstalowaną pod Node 22; działa niezależnie od wersji Node.
claudeBin: ~/.nvm/versions/node/v22.18.0/bin/claude

repo:
  path: ~/Documents/00_Nauka/AutoScoreDart
  github: krzylesniewski/AutoDartScore
  base: main
  public: true
  # Node 24 z nvm przed domyślnym Node 22. pnpm jest z Homebrew.
  pathPrepend: [~/.nvm/versions/node/v24.22.0/bin]
  install: pnpm install --frozen-lockfile
  requiredChecks: ['test', 'typecheck', 'lint', 'build', 'smoke'] # joby z .github/workflows/ci.yml
  # Bez konta bota: agenci, PR-y i merge idą z loginu gh (KrzysztofLesniewski, rola Write).
  maintainers: [KrzysztofLesniewski]
  merge: { method: squash, admin: false }
  # Plan i decyzje trzyma człowiek; agenci ich nie zmieniają.
  forbid:
    - auto-score-dart-pomysly.md
    - CLAUDE.md
    - 'rollout/**'
  alwaysInScope:
    - pnpm-lock.yaml
  denylist: [/Users/]
  verify:
    common:
      - pnpm install --frozen-lockfile
      - pnpm test
      - pnpm typecheck
      - pnpm lint

briefing:
  sources:
    - title: CLAUDE.md (zasady, stack, reguły X01, konwencje; wiążące)
      path: ~/Documents/00_Nauka/AutoScoreDart/CLAUDE.md
      kind: markdown
    - title: Plan i decyzje projektu (sekcja "Etap 1 jako PR-y" opisuje zakres P1-P7)
      path: ~/Documents/00_Nauka/AutoScoreDart/auto-score-dart-pomysly.md
      kind: markdown
    # Tylko dla PR-ów z briefTags: [a2].
    - title: Ekran startowy A2, zakres wdrożenia (wiążący dla P14; tylko UI, bez nowych funkcji)
      path: ~/Documents/00_Nauka/AutoScoreDart/design/new-game-a2.md
      kind: markdown
      tag: a2
    # Tylko dla PR-ów z briefTags: [highest-turn].
    - title: Statystyki, najwyższa tura zamiast liczby 180 (wiążące dla P18)
      path: ~/Documents/00_Nauka/AutoScoreDart/design/stats-highest-turn.md
      kind: markdown
      tag: highest-turn
    # Tylko dla PR-ów z briefTags: [rwd].
    - title: RWD ekranów, zakres i podział plików (wiążący dla P15-P17, P19 i P20; tylko układ, bez nowych funkcji poza Rewanżem)
      path: ~/Documents/00_Nauka/AutoScoreDart/design/rwd.md
      kind: markdown
      tag: rwd
    # Tylko dla PR-ów z briefTags: [p21-p23].
    - title: P21-P23, nagrane wyniki, efekt kliknięcia klawiatury, statystyki na telefonie (wiążące dla P21-P23, każdy PR tylko swoja sekcja)
      path: ~/Documents/00_Nauka/AutoScoreDart/design/plan-p21-p23.md
      kind: markdown
      tag: p21-p23
    # Tylko dla PR-ów z briefTags: [online].
    - title: P24-P30, aplikacja online (front i API na Mikr.us pod jednym adresem; wiążące dla P24-P30, każdy PR tylko swoja sekcja)
      path: ~/Documents/00_Nauka/AutoScoreDart/design/plan-online.md
      kind: markdown
      tag: online
    # Tylko dla PR-ów z briefTags: [p31-p32].
    - title: P31-P32, stała klawiatura na ekranie gry, domyślnie 301 i best of 1 (wiążące dla P31-P32, każdy PR tylko swoja sekcja)
      path: ~/Documents/00_Nauka/AutoScoreDart/design/plan-p31-p32.md
      kind: markdown
      tag: p31-p32

policy:
  concurrency: 4 # jak najwięcej równolegle (decyzja 2026-10-18)
  merge: human # driver scala po mojej akceptacji
  approval: inbox # akceptacja przez `rollout approve` (GitHub nie pozwala zatwierdzić własnego PR-a)
  # Agent odpowiada na pytania z briefu tylko tym, co rozstrzyga plan; reszta trafia do mnie.
  delegate: {}

# Małe kroki: plik spoza zakresu PR-a wraca do implementera przed weryfikacją.
gates:
  preVerify:
    scope: true

