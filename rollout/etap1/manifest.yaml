# AutoScore Dart: Etap 1 (Mac bez kamery) jako seria PR-ów.
# Źródło: CLAUDE.md i auto-score-dart-pomysly.md (sekcja "Realizacja przez claude-rollout").
# Opis pól: ~/.claude/skills/rollout/docs/manifest.html
# Ten plik jest w repo; ~/.rollouts/autoscore-etap1/manifest.yaml to dowiązanie do niego.
# Stan rolloutu (ledger, logi, inbox, briefy) zostaje w ~/.rollouts/autoscore-etap1/.
rollout: autoscore-etap1
model: opus
# claude jest binarką natywną zainstalowaną pod Node 22; działa niezależnie od wersji Node.
claudeBin: ~/.nvm/versions/node/v22.18.0/bin/claude

repo:
  path: ~/Documents/00_Nauka/AutoScoreDart
  github: krzylesniewski/AutoDartScore
  base: main # z powrotem main od 2026-10-21 (feat/keypad-ring scalona do main, CI nie biegało po pushu na nią)
  public: true
  # Node 24 z nvm przed domyślnym Node 22. pnpm jest z Homebrew.
  pathPrepend: [~/.nvm/versions/node/v24.22.0/bin]
  install: pnpm install --frozen-lockfile
  requiredChecks: ['test', 'typecheck', 'lint', 'build', 'smoke'] # joby z .github/workflows/ci.yml
  # Bez konta bota: agenci, PR-y i merge idą z loginu gh (KrzysztofLesniewski, rola Write).
  maintainers: [KrzysztofLesniewski]
  merge: { method: squash, admin: false }
  # Plan i decyzje trzyma człowiek; agenci ich nie zmieniają.
  forbid:
    - auto-score-dart-pomysly.md
    - CLAUDE.md
    - 'rollout/**'
  alwaysInScope:
    - pnpm-lock.yaml
  denylist: [/Users/]
  verify:
    common:
      - pnpm install --frozen-lockfile
      - pnpm test
      - pnpm typecheck
      - pnpm lint

briefing:
  sources:
    - title: CLAUDE.md (zasady, stack, reguły X01, konwencje; wiążące)
      path: ~/Documents/00_Nauka/AutoScoreDart/CLAUDE.md
      kind: markdown
    - title: Plan i decyzje projektu (sekcja "Etap 1 jako PR-y" opisuje zakres P1-P7)
      path: ~/Documents/00_Nauka/AutoScoreDart/auto-score-dart-pomysly.md
      kind: markdown
