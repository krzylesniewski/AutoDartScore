# AutoScore Dart: Etap 1 (Mac bez kamery) jako seria PR-ów.
# Źródło: CLAUDE.md i auto-score-dart-pomysly.md (sekcja "Realizacja przez claude-rollout").
# Opis pól: ~/.claude/skills/rollout/docs/manifest.html
# Ten plik jest w repo; ~/.rollouts/autoscore-etap1/manifest.yaml to dowiązanie do niego.
# Stan rolloutu (ledger, logi, inbox, briefy) zostaje w ~/.rollouts/autoscore-etap1/.
rollout: autoscore-etap1
model: opus
# claude jest binarką natywną zainstalowaną pod Node 22; działa niezależnie od wersji Node.
claudeBin: ~/.nvm/versions/node/v22.18.0/bin/claude

repo:
  path: ~/Documents/00_Nauka/AutoScoreDart
  github: krzylesniewski/AutoDartScore
  base: main
  public: true
  # Node 24 z nvm przed domyślnym Node 22. pnpm jest z Homebrew.
  pathPrepend: [~/.nvm/versions/node/v24.22.0/bin]
  install: pnpm install --frozen-lockfile
  requiredChecks: ['test', 'typecheck', 'lint'] # joby z .github/workflows/ci.yml
  # Bez konta bota: agenci, PR-y i merge idą z loginu gh (KrzysztofLesniewski, rola Write).
  maintainers: [KrzysztofLesniewski]
  merge: { method: squash, admin: false }
  # Plan i decyzje trzyma człowiek; agenci ich nie zmieniają.
  forbid:
    - auto-score-dart-pomysly.md
    - CLAUDE.md
    - 'rollout/**'
  alwaysInScope:
    - pnpm-lock.yaml
  denylist: [/Users/]
  verify:
    common:
      - pnpm install --frozen-lockfile
      - pnpm test
      - pnpm typecheck
      - pnpm lint

briefing:
  sources:
    - title: CLAUDE.md (zasady, stack, reguły X01, konwencje; wiążące)
      path: ~/Documents/00_Nauka/AutoScoreDart/CLAUDE.md
      kind: markdown
    - title: Plan i decyzje projektu (sekcja "Etap 1 jako PR-y" opisuje zakres P1-P7)
      path: ~/Documents/00_Nauka/AutoScoreDart/auto-score-dart-pomysly.md
      kind: markdown

policy:
  concurrency: 4 # jak najwięcej równolegle (decyzja 2026-10-18)
  merge: human # driver scala po mojej akceptacji
  approval: inbox # akceptacja przez `rollout approve` (GitHub nie pozwala zatwierdzić własnego PR-a)
  # Agent odpowiada na pytania z briefu tylko tym, co rozstrzyga plan; reszta trafia do mnie.
  delegate: {}

# Małe kroki: plik spoza zakresu PR-a wraca do implementera przed weryfikacją.
gates:
  preVerify:
    scope: true

# P1 (schema) i P2 (silnik X01 1v1) zrobione ręcznie i scalone do main 2026-10-18.
prs:
  - id: P3
    branch: feat/engine-casual-practice
    title: 'feat(engine): casual placements and practice modes'
    brief: briefs/P3.md
    priority: 50
    effort: { brief: high, implement: high, verify: high }
    changeset: none
    scope: ['packages/engine/**', 'packages/schema/**']

  - id: P4
    branch: feat/server-api
    title: 'feat(server): match API, WebSocket and event-sourced SQLite storage'
    brief: briefs/P4.md
    deps: [P3]
    priority: 40
    effort: { brief: high, implement: high, verify: high }
    changeset: none
    scope: ['packages/server/**', 'packages/schema/**', 'package.json']

  - id: P5
    branch: feat/web-game-screen
    title: 'feat(web): game screen with scoreboard and manual input keypad'
    brief: briefs/P5.md
    deps: [P4]
    priority: 30
    effort: { brief: high, implement: high, verify: high }
    changeset: none
    scope: ['packages/web/**', 'package.json', 'eslint.config.js']

  # Wygląd ekranu gry według makiet motywu A (design/mockups, tokeny w design/theme.css).
  - id: P5b
    branch: feat/web-theme-a
    title: 'feat(web): game screen styled after the theme A mockups'
    brief: briefs/P5b.md
    deps: [P5]
    priority: 35
    effort: { brief: high, implement: high, verify: high }
    changeset: none
    scope: ['packages/web/**']

  - id: P6
    branch: feat/stats
    title: 'feat: player statistics and match summary'
    brief: briefs/P6.md
    deps: [P5b]
    priority: 20
    effort: { brief: high, implement: high, verify: high }
    changeset: none
    scope: ['packages/server/**', 'packages/web/**', 'packages/schema/**']

  - id: P7
    branch: feat/audio-announcer
    title: 'feat(audio): score, bust and winner announcements'
    brief: briefs/P7.md
    deps: [P5]
    priority: 10
    effort: { brief: high, implement: high, verify: high }
    changeset: none
    scope: ['packages/audio/**', 'packages/web/**']

  # Historia meczów, head-to-head, wykres formy, profil gracza (plan: tabela "Etap 1 jako PR-y").
  - id: P8
    branch: feat/history-profiles
    title: 'feat: match history, head-to-head, form chart and player profiles'
    brief: briefs/P8.md
    deps: [P13]
    priority: 5
    effort: { brief: high, implement: high, verify: high }
    changeset: none
    scope: ['packages/server/**', 'packages/web/**', 'packages/schema/**', 'packages/engine/**']

  # Porzucenie i wznowienie meczu, lista nieskończonych meczów na HOME (plan: uwaga "Porzucenie meczu w P9").
  - id: P9
    branch: feat/abandon-resume
    title: 'feat: abandon and resume a match, unfinished matches on home'
    brief: briefs/P9.md
    deps: [P5b]
    priority: 8
    effort: { brief: high, implement: high, verify: high }
    changeset: none
    scope: ['packages/schema/**', 'packages/server/**', 'packages/web/**']

  # Efekty dźwiękowe dla bustu i wygranej (plan: uwaga "Efekty dźwiękowe w P10").
  - id: P10
    branch: feat/audio-effects
    title: 'feat(audio): sound effects for bust and win'
    brief: briefs/P10.md
    deps: [P5b, P7]
    priority: 15
    effort: { brief: high, implement: high, verify: high }
    changeset: none
    scope: ['packages/audio/**', 'packages/web/**']

  # README repo i pakietów (plan: uwaga "README w P11"). Równolegle z resztą.
  - id: P11
    branch: docs/readme
    title: 'docs: README for the repository and packages'
    brief: briefs/P11.md
    deps: [P10]
    priority: 12
    effort: { brief: high, implement: high, verify: high }
    changeset: none
    scope: ['README.md', 'packages/*/README.md']

  # Ekran startowy i ekran statystyk według makiet (plan: "Ekran startowy i statystyki: punkty do implementacji" i "Decyzje").
  - id: P12
    branch: feat/home-stats-mockups
    title: 'feat(web): start and statistics screens after the theme A mockups'
    brief: briefs/P12.md
    deps: [P9]
    priority: 9
    effort: { brief: high, implement: high, verify: high }
    changeset: none
    scope: ['packages/web/**', 'packages/server/**', 'packages/schema/**']

  # "Zakończ trening" dla Solo 501 i Free run (plan: "Decyzje" w sekcji ekranu startowego).
  - id: P13
    branch: feat/end-practice
    title: 'feat: end a practice session from the game screen and the home list'
    brief: briefs/P13.md
    deps: [P12]
    priority: 9
    effort: { brief: high, implement: high, verify: high }
    changeset: none
    scope: ['packages/web/**', 'packages/server/**', 'packages/schema/**']
